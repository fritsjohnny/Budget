<mat-form-field appearance="fill" style="width: 100%;">
  <mat-label>{{label}}</mat-label>
  <input matInput [matDatepicker]="dp" [formControl]="date" (dateInput)="dateChanged($event.value)">
  <mat-error *ngIf="isRequired && date.hasError('required')">
    Campo <strong>obrigatório</strong>.
  </mat-error>
  <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
  <mat-datepicker #dp panelClass="modern-datepicker-panel"></mat-datepicker>
</mat-form-field>
