<div class="budget-notification-bubble" role="alert">
  <mat-icon class="budget-notification-bubble-icon">notifications</mat-icon>
  <span class="budget-notification-bubble-content">{{ message }}</span>
  <button mat-icon-button type="button" aria-label="Fechar notificação" class="budget-notification-bubble-close" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</div>
