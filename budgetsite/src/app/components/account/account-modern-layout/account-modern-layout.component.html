<app-modern-reference-page-shell
    [reference]="context.reference"
    refreshLabel="Atualizando contas..."
    [refreshDisabled]="!context.hideProgress"
    [refreshLoading]="!context.hideProgress"
    [navigationDisabled]="!context.hideProgress"
    (refreshRequested)="context.refresh()"
>
    <app-modern-reference-selector
        modernReferenceSelector
        [reference]="context.reference"
        storageKey="accountDate"
        ariaLabel="Referência das contas"
        [showOptionButton]="false"
        (referenceChange)="onReferenceChange($event)"
    ></app-modern-reference-selector>

    <div class="modern-account-content">
        <section class="account-selector" aria-label="Seleção de conta">
            <div class="selected-account">
                <div class="selected-account-copy">
                    <span class="account-selector-icon"
                        ><mat-icon>account_balance</mat-icon></span
                    >
                    <div>
                        <small>Conta selecionada</small>
                        <strong>{{
                            context.account?.name || "Selecione uma conta"
                        }}</strong>
                    </div>
                </div>

                <div class="selected-account-actions">
                    <button
                        mat-icon-button
                        class="add-account-button"
                        (click)="context.accountDialog()"
                        matTooltip="Cadastrar ou gerenciar contas"
                        aria-label="Cadastrar ou gerenciar contas"
                    >
                        <span class="add-account-icon" aria-hidden="true">
                            <mat-icon class="add-account-bank"
                                >account_balance</mat-icon
                            >
                            <mat-icon class="add-account-plus"
                                >add_circle</mat-icon
                            >
                        </span>
                    </button>
                    <button
                        mat-icon-button
                        (click)="context.refresh()"
                        matTooltip="Atualizar contas"
                        aria-label="Atualizar contas"
                    >
                        <mat-icon>autorenew</mat-icon>
                    </button>
                    <button
                        *ngIf="context.account?.appPackageName"
                        mat-icon-button
                        (click)="context.openBankApp()"
                        matTooltip="Abrir aplicativo do banco"
                        aria-label="Abrir aplicativo do banco"
                    >
                        <mat-icon>open_in_new</mat-icon>
                    </button>
                </div>
            </div>

            <div
                class="account-chips account-drag-boundary"
                data-reference-swipe-ignore
                cdkDropList
                cdkDropListOrientation="horizontal"
                [cdkDropListAutoScrollStep]="7"
                [cdkDropListData]="context.accountsVisible || []"
                (cdkDropListDropped)="context.drop($event)"
            >
                <button
                    mat-button
                    class="account-chip"
                    *ngFor="
                        let account of context.accountsVisible;
                        trackBy: trackById
                    "
                    [class.account-chip-active]="
                        account.id === context.accountId
                    "
                    [style.--account-background]="account.background"
                    [style.--account-color]="account.color"
                    (click)="context.setAccount(account)"
                    cdkDrag
                    cdkDragLockAxis="x"
                    cdkDragBoundary=".account-drag-boundary"
                    [style.--drag-accent]="account.color || '#29bf6a'"
                >
                    <span class="account-chip-swatch"
                        ><mat-icon>account_balance_wallet</mat-icon></span
                    >
                    <span>{{ context.getDescription(account) }}</span>
                </button>
            </div>
        </section>

        <app-accountpostings
            [accountId]="context.accountId"
            [reference]="context.reference"
            [refreshRequest]="context.refreshRequest"
            [accountsList]="context.accounts"
            [modernLayout]="true"
            (accountUpdated)="context.updateAccountFromChild($event)"
        ></app-accountpostings>
    </div>
</app-modern-reference-page-shell>
