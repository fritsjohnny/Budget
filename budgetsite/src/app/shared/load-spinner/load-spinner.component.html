<div
    class="load-spinner-overlay"
    *ngIf="loading"
    role="status"
    aria-live="polite"
    aria-label="Carregando"
>
    <div class="load-spinner-content">
        <mat-spinner color="accent" [diameter]="52"></mat-spinner>

        <span
            *ngIf="message"
            class="load-spinner-message"
        >
            {{ message }}
        </span>
    </div>
</div>
