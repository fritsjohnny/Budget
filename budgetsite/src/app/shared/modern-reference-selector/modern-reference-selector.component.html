<section class="modern-reference-card" [attr.aria-label]="ariaLabel">
  <div class="modern-reference-navigation">
    <button mat-button class="modern-reference-side" (click)="setPreviousMonth()" aria-label="Referência anterior">
      <mat-icon>chevron_left</mat-icon>
      <span>{{ previousMonthName }}</span>
    </button>

    <strong class="modern-reference-title">{{ referenceTitle }}</strong>

    <button mat-button class="modern-reference-side modern-reference-side-next" (click)="setNextMonth()" aria-label="Próxima referência">
      <span>{{ nextMonthName }}</span>
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <div class="modern-reference-actions" [class.modern-reference-actions-no-option]="!showOptionButton">
    <button mat-button class="modern-reference-picker" (click)="modernDatepicker.open()" aria-label="Selecionar mês e ano">
      <mat-icon>calendar_month</mat-icon>
      <span>{{ referenceHead }}</span>
      <mat-icon>expand_more</mat-icon>
    </button>

    <button
      mat-stroked-button
      class="modern-reference-today"
      [class.modern-reference-today-active]="isCurrentReference"
      (click)="setCurrentMonth()"
    >
      <mat-icon>today</mat-icon>
      <span>Hoje</span>
    </button>

    <button
      *ngIf="showOptionButton && optionsAsMenu"
      mat-icon-button
      class="modern-reference-options"
      [matMenuTriggerFor]="modernOptionsMenu"
      [matTooltip]="optionTooltip"
      [attr.aria-label]="optionAriaLabel"
    >
      <mat-icon>{{ optionIcon }}</mat-icon>
    </button>

    <button
      *ngIf="showOptionButton && !optionsAsMenu"
      mat-icon-button
      class="modern-reference-options"
      (click)="openOptions()"
      [matTooltip]="optionTooltip"
      [attr.aria-label]="optionAriaLabel"
    >
      <mat-icon>{{ optionIcon }}</mat-icon>
    </button>
  </div>

  <ng-template #projectedOptions>
    <ng-content></ng-content>
  </ng-template>

  <ng-container *ngIf="!optionsAsMenu">
    <ng-container *ngTemplateOutlet="projectedOptions"></ng-container>
  </ng-container>

  <mat-menu #modernOptionsMenu="matMenu" class="modern-reference-options-menu">
    <div class="modern-reference-options-content" (click)="$event.stopPropagation()">
      <ng-container *ngTemplateOutlet="projectedOptions"></ng-container>
    </div>
  </mat-menu>

  <mat-form-field class="modern-reference-picker-proxy" aria-hidden="true">
    <input matInput [matDatepicker]="modernDatepicker" [formControl]="date" />
    <mat-datepicker
      #modernDatepicker
      startView="multi-year"
      (yearSelected)="chosenYearHandler($event)"
      (monthSelected)="chosenMonthHandler($event, modernDatepicker)"
      [panelClass]="['example-month-picker', 'modern-datepicker-panel']"
    ></mat-datepicker>
  </mat-form-field>

  <ng-content></ng-content>
</section>
